version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: connectsphere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: connectsphere
      POSTGRES_USER: connectsphere
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "connectsphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: connectsphere_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      PORT: ${PORT}
      FRONTEND_URL: ${FRONTEND_URL}
      NODE_ENV: ${NODE_ENV}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/backend/src
      - ./backend/package.json:/backend/package.json
      - ./backend/tsconfig.json:/backend/tsconfig.json
 
  frontend:
    build: ./frontend
    container_name: connectsphere_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/frontend/src
      - ./frontend/package.json:/frontend/package.json
      - ./frontend/next.config.ts:/frontend/next.config.ts
      - ./frontend/tailwind.config.ts:/frontend/tailwind.config.ts
      - ./frontend/tsconfig.json:/frontend/tsconfig.json

volumes:
  postgres_data: